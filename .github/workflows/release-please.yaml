on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]

permissions: {}

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # this is not recommended, but we don't run any actions on release
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
